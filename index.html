<script>
;(function () {
  var HIDE_CLS = 'is-hidden'
  var LOADER_ID = 'va-fouc-loader'
  var FOUC_STYLE_ID = 'sakura-fouc'
  var LOADER_STYLE_ID = 'va-fouc-loader-style'
  var BODY_LOADING_CLS = 'sakura-loading'
  var hidden = false
  var pollTimer
  var startTime = Date.now()
  var MIN_SHOW =  480 
  var MAX_DURATION =  6000 

  function stylesReady() {
    var links = document.querySelectorAll('link[rel="stylesheet"]')
    for (var i = 0; i < links.length; i++) {
      if (!links[i].sheet) return false
    }
    return true
  }

  function pageReady() {
    return document.readyState !== 'loading' && stylesReady()
  }

  function resetHomeScroll() {
    var path = location.pathname.replace(/\/$/, '') || '/'
    if (path !== '/' || location.hash) return
    window.scrollTo(0, 0)
    requestAnimationFrame(function () {
      window.scrollTo(0, 0)
    })
  }

  function revealPage() {
    document.body.classList.remove(BODY_LOADING_CLS)
    var foucStyle = document.getElementById(FOUC_STYLE_ID)
    if (foucStyle) foucStyle.remove()
    resetHomeScroll()
  }

  function hideLoader() {
    if (hidden) return
    hidden = true
    if (pollTimer) clearInterval(pollTimer)
    revealPage()
    var loader = document.getElementById(LOADER_ID)
    if (!loader) return
    loader.classList.add(HIDE_CLS)
    setTimeout(function () {
      loader.remove()
      var style = document.getElementById(LOADER_STYLE_ID)
      if (style) style.remove()
    }, 300)
  }

  function canHide() {
    var elapsed = Date.now() - startTime
    if (elapsed < MIN_SHOW) return false
    if (pageReady()) return true
    return elapsed >= MIN_SHOW + 1800
  }

  function tryHide() {
    if (canHide()) hideLoader()
  }

  function startPolling() {
    if (hidden || pollTimer) return
    var tries = 0
    pollTimer = setInterval(function () {
      tries++
      tryHide()
      if (hidden || tries >= 240) clearInterval(pollTimer)
    }, 50)
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startPolling)
  } else {
    startPolling()
  }

  window.addEventListener('load', tryHide)
  setTimeout(function () {
    if (!hidden) hideLoader()
  }, MAX_DURATION)
})()
</script>
